name: Swaply
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.3.4
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  image_picker: ^1.0.7
  flutter_rating_bar: ^4.0.1
  timeago: ^3.6.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  cached_network_image: ^3.3.1
  uuid: ^4.4.0
  flutter_svg: ^2.2.4
  record: ^5.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/swaply_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#2451E8"
  adaptive_icon_foreground: "assets/images/swaply_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/